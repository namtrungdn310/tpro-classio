version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "03:50"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
